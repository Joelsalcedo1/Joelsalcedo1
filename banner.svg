<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Joel Salcedo Ojeda, UX Engineer. Diseño el producto y lo construyo: interfaz, datos y backend.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#150a2e"/>
    </linearGradient>
    <linearGradient id="rol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="0.5" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="20"/></clipPath>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
  </defs>
  <style>
    .b1 { animation: m1 14s ease-in-out infinite alternate; }
    .b2 { animation: m2 18s ease-in-out infinite alternate; }
    .b3 { animation: m3 16s ease-in-out infinite alternate; }
    .b4 { animation: m4 20s ease-in-out infinite alternate; }
    .cur { animation: blink 1.1s steps(1) infinite; }



    @keyframes m1 { from { transform: translate(0,0); } to { transform: translate(140px,60px); } }
    @keyframes m2 { from { transform: translate(0,0); } to { transform: translate(-160px,-50px); } }
    @keyframes m3 { from { transform: translate(0,0); } to { transform: translate(120px,-70px); } }
    @keyframes m4 { from { transform: translate(0,0); } to { transform: translate(-110px,60px); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="180"  cy="60"  r="150" fill="#7c3aed" fill-opacity="0.75"/>
      <circle class="b2" cx="1060" cy="300" r="170" fill="#ff3d81" fill-opacity="0.60"/>
      <circle class="b3" cx="820"  cy="40"  r="130" fill="#22d3ee" fill-opacity="0.50"/>
      <circle class="b4" cx="470"  cy="350" r="120" fill="#ffb020" fill-opacity="0.45"/>
    </g>
    <rect width="1200" height="340" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#e6e9ff" fill-opacity="0.85" font-size="20" font-weight="500">Hola, soy</text>
    <text x="69" y="158" fill="#ffffff" font-size="66" font-weight="800" letter-spacing="-1.6">Joel Salcedo Ojeda</text>
    <g>
      <text x="72" y="210" fill="url(#rol)" font-size="36" font-weight="800" letter-spacing="-0.4">UX Engineer<tspan class="cur" fill="#ff4d8d" font-weight="400" dx="6">|</tspan></text>
      <text x="73" y="246" fill="#d7dcf5" font-size="21" font-weight="400">Diseño el producto y lo construyo: interfaz, datos y backend.</text>
    </g>
    <g>
    <rect x="72" y="272" width="89" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="116.5" y="294.4" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Fintech</text>
    <rect x="171" y="272" width="125" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="233.5" y="294.4" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">iOS · Swift</text>
    <rect x="306" y="272" width="206" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="409.0" y="294.4" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Next.js · TypeScript</text>
    <rect x="522" y="272" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="607.0" y="294.4" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">PostgreSQL · RLS</text>
    <rect x="702" y="272" width="233" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="818.5" y="294.4" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Spec-Driven Development</text>
    <rect x="945" y="272" width="125" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="1007.5" y="294.4" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">IA aplicada</text>
    </g>
  </g>
</svg>
