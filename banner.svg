<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Joel Salcedo Ojeda, UX Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101d33"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a23d"/>
      <stop offset="1" stop-color="#e8a23d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="98" fill="#e8a23d" font-size="18" font-weight="600" letter-spacing="5">UX ENGINEER</text>
    <text x="70" y="164" fill="#ffffff" font-size="60" font-weight="700" letter-spacing="-1.4">Joel Salcedo Ojeda</text>
    <rect x="72" y="188" width="300" height="2" fill="url(#line)"/>
    <text x="72" y="228" fill="#aebbd0" font-size="22" font-weight="400">Diseño el producto y lo construyo: interfaz, datos y backend.</text>

    <g text-anchor="end">
      <text x="1128" y="104" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">7 años</text>
      <text x="1128" y="128" fill="#8494ad" font-size="15">de producto digital</text>
      <text x="1128" y="176" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">3 en fintech</text>
      <text x="1128" y="200" fill="#8494ad" font-size="15">pagos B2B y crédito</text>
      <text x="1128" y="248" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">2 apps iOS</text>
      <text x="1128" y="272" fill="#8494ad" font-size="15">publicadas en la App Store</text>
    </g>
    <rect x="884" y="60" width="1" height="216" fill="#ffffff" fill-opacity="0.10"/>
  </g>
</svg>
