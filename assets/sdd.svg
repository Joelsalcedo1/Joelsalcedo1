<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Spec-Driven Development en seis pasos: especificación, plan técnico y tareas las defino yo; el agente implementa una tarea a la vez; puertas de calidad y revisión antes de producción.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#150a2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="0.5" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <clipPath id="clip"><rect width="1200" height="470" rx="20"/></clipPath>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7cdf0"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7aa8"/></marker>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="470" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="140" cy="40" r="150" fill="#7c3aed" fill-opacity="0.55"/>
      <circle cx="1090" cy="440" r="170" fill="#ff3d81" fill-opacity="0.40"/>
      <circle cx="700" cy="-20" r="120" fill="#22d3ee" fill-opacity="0.28"/>
    </g>
    <rect width="1200" height="470" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="44" y="62" fill="url(#acc)" font-size="30" font-weight="800" letter-spacing="-0.4">Spec-Driven Development</text>
    <text x="45" y="92" fill="#d7dcf5" font-size="17" font-weight="400">La especificación se escribe primero. El agente de IA implementa contra ella, una tarea a la vez.</text>

    <!-- quién hace cada tramo -->
    <g font-size="12.5" font-weight="700" letter-spacing="1.4">
      <text x="44" y="126" fill="#ffc861">YO DEFINO</text>
      <path d="M44 142 V135 H596 V142" fill="none" stroke="#ffb020" stroke-opacity="0.85" stroke-width="1.5"/>
      <text x="614" y="126" fill="#ff8fb5">EL AGENTE</text>
      <path d="M614 142 V135 H786 V142" fill="none" stroke="#ff4d8d" stroke-opacity="0.9" stroke-width="1.5"/>
      <text x="804" y="126" fill="#b9a2ff">SE VERIFICA</text>
      <path d="M804 142 V135 H1156 V142" fill="none" stroke="#8b5cf6" stroke-opacity="0.95" stroke-width="1.5"/>
    </g>

    <!-- tarjetas -->
    <g>
      <g transform="translate(44,156)">
        <rect width="172" height="176" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="18" y="40" fill="#ffc861" font-size="24" font-weight="800">01</text>
        <text x="18" y="74" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="-0.2">Especificación</text>
        <rect x="18" y="88" width="78" height="24" rx="6" fill="#ffffff" fill-opacity="0.12"/>
        <text x="57" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">spec.md</text>
        <text x="18" y="138" fill="#d7dcf5" font-size="14">Qué se construye</text>
        <text x="18" y="157" fill="#d7dcf5" font-size="14">y por qué</text>
      </g>
      <g transform="translate(234,156)">
        <rect width="172" height="176" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="18" y="40" fill="#ffc861" font-size="24" font-weight="800">02</text>
        <text x="18" y="74" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="-0.2">Plan técnico</text>
        <rect x="18" y="88" width="126" height="24" rx="6" fill="#ffffff" fill-opacity="0.12"/>
        <text x="81" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">plantecnico.md</text>
        <text x="18" y="138" fill="#d7dcf5" font-size="14">Datos, contrato,</text>
        <text x="18" y="157" fill="#d7dcf5" font-size="14">seguridad y pruebas</text>
      </g>
      <g transform="translate(424,156)">
        <rect width="172" height="176" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="18" y="40" fill="#ffc861" font-size="24" font-weight="800">03</text>
        <text x="18" y="74" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="-0.2">Tareas</text>
        <rect x="18" y="88" width="78" height="24" rx="6" fill="#ffffff" fill-opacity="0.12"/>
        <text x="57" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">task.md</text>
        <text x="18" y="138" fill="#d7dcf5" font-size="14">Tareas numeradas,</text>
        <text x="18" y="157" fill="#d7dcf5" font-size="14">pequeñas y en orden</text>
      </g>
      <g transform="translate(614,156)">
        <rect width="172" height="176" rx="14" fill="#ff4d8d" fill-opacity="0.16" stroke="#ff7aa8" stroke-opacity="0.75"/>
        <text x="18" y="40" fill="#ff8fb5" font-size="24" font-weight="800">04</text>
        <text x="18" y="74" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="-0.2">Implementación</text>
        <rect x="18" y="88" width="102" height="24" rx="6" fill="#ffffff" fill-opacity="0.14"/>
        <text x="69" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Claude Code</text>
        <text x="18" y="138" fill="#d7dcf5" font-size="14">Una tarea a la vez,</text>
        <text x="18" y="157" fill="#d7dcf5" font-size="14">contra la spec</text>
      </g>
      <g transform="translate(804,156)">
        <rect width="172" height="176" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="18" y="40" fill="#b9a2ff" font-size="24" font-weight="800">05</text>
        <text x="18" y="74" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="-0.2">Calidad</text>
        <rect x="18" y="88" width="118" height="24" rx="6" fill="#ffffff" fill-opacity="0.12"/>
        <text x="77" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">todo en verde</text>
        <text x="18" y="138" fill="#d7dcf5" font-size="14">Tipos, lint, pruebas</text>
        <text x="18" y="157" fill="#d7dcf5" font-size="14">y seguridad</text>
      </g>
      <g transform="translate(994,156)">
        <rect width="162" height="176" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
        <text x="18" y="40" fill="#b9a2ff" font-size="24" font-weight="800">06</text>
        <text x="18" y="74" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="-0.2">Entrega</text>
        <rect x="18" y="88" width="102" height="24" rx="6" fill="#ffffff" fill-opacity="0.12"/>
        <text x="69" y="104.5" text-anchor="middle" fill="#ffffff" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pull request</text>
        <text x="18" y="138" fill="#d7dcf5" font-size="14">Code review, QA</text>
        <text x="18" y="157" fill="#d7dcf5" font-size="14">y producción</text>
      </g>
    </g>

    <!-- flechas entre pasos -->
    <g stroke="#c7cdf0" stroke-width="1.6" fill="none">
      <path d="M218 244 H231" marker-end="url(#ah)"/>
      <path d="M408 244 H421" marker-end="url(#ah)"/>
      <path d="M598 244 H611" marker-end="url(#ah)"/>
      <path d="M788 244 H801" marker-end="url(#ah)"/>
      <path d="M978 244 H991" marker-end="url(#ah)"/>
    </g>

    <!-- bucles -->
    <path d="M890 334 V364 Q890 376 878 376 H712 Q700 376 700 364 V338" fill="none" stroke="#ff7aa8" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ahp)"/>
    <rect x="718" y="365" width="154" height="22" rx="11" fill="#1a0f2e" stroke="#ff7aa8" stroke-opacity="0.7"/>
    <text x="795" y="380.5" text-anchor="middle" fill="#ffc2d8" font-size="12.5" font-weight="600">si falla, se corrige</text>

    <path d="M1075 334 V410 Q1075 422 1063 422 H672 Q660 422 660 410 V338" fill="none" stroke="#c7cdf0" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="790" y="411" width="176" height="22" rx="11" fill="#170d2d" stroke="#c7cdf0" stroke-opacity="0.6"/>
    <text x="878" y="426.5" text-anchor="middle" fill="#e6e9ff" font-size="12.5" font-weight="600">pasa: siguiente tarea</text>

    <text x="45" y="424" fill="#aab1d6" font-size="13.5">Contexto permanente del agente: <tspan fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CLAUDE.md</tspan> y <tspan fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DECISIONES.md</tspan></text>
  </g>
</svg>
